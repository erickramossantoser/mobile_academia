name: controle_lotacao_academia
description: "Controle de Lotação 2.0 — Gerenciamento de Acessos em uma academia"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.3
  google_fonts: ^6.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/academia_bg.png
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icone_academia.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/icone_academia.png
    background_color: "#1565C0"
    theme_color: "#1565C0"
  windows:
    generate: true
    image_path: assets/images/icone_academia.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/icone_academia.png
